11" fill="#faf7fe" stroke="#9cb2a5"/><text x="972" y="1078" fill="#173f32" font-family="sans-serif" font-size="17" font-weight="700">运行支持与可观察性</text><text x="972" y="1104" fill="#526b5d" font-family="sans-serif" font-size="12">Settings · Credentials · Telemetry</text><text x="972" y="1129" fill="#657a6f" font-family="sans-serif" font-size="11">查看固定版本源码 ↗</text></a><text x="30" y="1226" fill="#566b61" font-family="sans-serif" font-size="12">实线 = 标注的主要调用 / 数据关系；虚线 = 组装或可选接入。箭头不是完整调用图，也不规定并发执行顺序。</text><text x="30" y="1251" fill="#566b61" font-family="sans-serif" font-size="12">布局表达职责与协作，不表示目录层级；底部基础带也不是每次请求的执行阶段。</text></svg>