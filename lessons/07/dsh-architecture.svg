<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" viewBox="0 0 1280 1280" role="group" aria-labelledby="architecture-title architecture-desc"><title id="architecture-title">DeepSeek Harness 框架架构：插件基础、Agent 运行时与可替换能力</title><desc id="architecture-desc">中心是请求组装、Agent 驱动、工具运行时和会话事实；外围是宿主、组装、模型、执行能力及任务编排；底部是跨子系统的插件、作用域和策略支持。箭头注明主要协作，虚线表示可选接入。位置不表示源码目录或课次。</desc><defs><marker id="arch-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L7 3.5 L0 7 Z" fill="#567666"/></marker></defs><rect width="1280" height="1280" rx="18" fill="#f7f6ef"/><text x="30" y="38" fill="#173f32" font-size="23" font-family="sans-serif" font-weight="700">DeepSeek Harness · 框架结构与协作</text><text x="30" y="64" fill="#566b61" font-size="13" font-family="sans-serif">0.2.1-alpha.1 / 5badb15 · 中心运行时 + 可替换能力 + 横向插件基础 · 全部按配置组合</text><rect x="330" y="265" width="610" height="402" rx="18" fill="#e5eeea" stroke="#7f9e8e" stroke-width="2"/><text x="350" y="295" fill="#173f32" font-size="17" font-family="sans-serif" font-weight="700">Agent 运行时 · 四项协作职责，均可通过插件扩展</text><rect x="20" y="989" width="1240" height="200" rx="16" fill="#ede8f2" stroke="#b7aec2"/><text x="38" y="1024" fill="#443751" font-size="17" font-family="sans-serif" font-weight="700">横向基础 · 为上方各子系统提供组合、所有权与扩展点</text><path d="M320 196 V235 H785 V315" fill="none" stroke="#567666" stroke-width="1.8" marker-end="url(#arch-arrow)"/><text x="445" y="229" fill="#405d4d" font-size="12" font-family="sans-serif">输入 / Agent 接口</text><path d="M950 196 V250 H940" fill="none" stroke="#567666" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arch-arrow)"/><text x="969" y="240" fill="#405d4d" font-size="12" font-family="sans-serif">挂载与配置运行时</text><path d="M300 357 H350" fill="none" stroke="#567666" stroke-width="1.8" marker-end="url(#arch-arrow)"/><text x="306" y="347" fill="#405d4d" font-size="12" font-family="sans-serif">贡献</text><path d="M620 357 H650" fill="none" stroke="#567666" stroke-width="1.8" marker-end="url(#arch-arrow)"/><text x="620" y="343" fill="#405d4d" font-size="12" font-family="sans-serif">组装</text><path d="M920 357 H970" fill="none" stroke="#567666" stroke-width="1.8" marker-end="url(#arch-arrow)"/><text x="927" y="345" fill="#405d4d" font-size="12" font-family="sans-serif">请求</text><path d="M970 389 H920" fill="none" stroke="#567666" stroke-width="1.8" marker-end="url(#arch-arrow)"/><text x="922" y="411" fill="#405d4d" font-size="12" font-family="sans-serif">流式响应</text><path d="M785 411 V515" fill="none" stroke="#567666" stroke-width="1.8" marker-end="url(#arch-arrow)"/><text x="797" y="465" fill="#405d4d" font-size="12" font-family="sans-serif">工具调用</text><path d="M650 390 H635 V490 H560 V515" fill="none" stroke="#567666" stroke-width="1.8" marker-end="url(#arch-arrow)"/><text x="545" y="479" fill="#405d4d" font-size="12" font-family="sans-serif">写入运行事实</text><path d="M485 515 V411" fill="none" stroke="#567666" stroke-width="1.8" marker-end="url(#arch-arrow)"/><text x="449" y="450" fill="#405d4d" font-size="12" font-family="sans-serif">历史</text><path d="M650 565 H620" fill="none" stroke="#567666" stroke-width="1.8" marker-end="url(#arch-arrow)"/><text x="620" y="553" fill="#405d4d" font-size="12" font-family="sans-serif">结果</text><path d="M920 558 H970" fill="none" stroke="#567666" stroke-width="1.8" marker-end="url(#arch-arrow)"/><text x="927" y="547" fill="#405d4d" font-size="12" font-family="sans-serif">调用</text><path d="M300 540 H320 V247 H705 V315" fill="none" stroke="#567666" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arch-arrow)"/><text x="38" y="241" fill="#405d4d" font-size="12" font-family="sans-serif">可选：创建 / 继续 / 投递</text><path d="M300 797 H325 V694 H805 V611" fill="none" stroke="#567666" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arch-arrow)"/><text x="395" y="689" fill="#405d4d" font-size="12" font-family="sans-serif">可选工具注册 / 调用</text><path d="M485 611 V755" fill="none" stroke="#567666" stroke-width="1.8" marker-end="url(#arch-arrow)"/><text x="495" y="723" fill="#405d4d" font-size="12" font-family="sans-serif">持久化 / 恢复</text><path d="M560 611 V716 H785 V755" fill="none" stroke="#567666" stroke-width="1.8" marker-end="url(#arch-arrow)"/><text x="658" y="733" fill="#405d4d" font-size="12" font-family="sans-serif">提交事件 → 状态投影</text><text x="980" y="688" fill="#566b61" font-size="13" font-family="sans-serif">外部边界</text><text x="980" y="713" fill="#566b61" font-size="12" font-family="sans-serif">模型服务、远端工具与执行环境</text><text x="980" y="736" fill="#566b61" font-size="12" font-family="sans-serif">由相应适配器 / 提供方连接。</text><text x="650" y="890" fill="#566b61" font-size="12" font-family="sans-serif">状态视图 → 宿主呈现；实时流走独立跟随通道。</text><text x="30" y="948" fill="#566b61" font-size="13" font-family="sans-serif">底部基础带支撑所有相关组件；为避免遮挡，省略向各插件的重复依赖连线。</text><a href="https://github.com/deepseek-ai/deepseek-harness/blob/5badb15009ae1756c3afe0ae0cef1faafc290ccc/docs/architecture.zh.md" target="_blank"><rect x="30" y="100" width="580" height="96" rx="11" fill="#e4eee3" stroke="#9cb2a5"/><text x="42" y="128" fill="#173f32" font-family="sans-serif" font-size="17" font-weight="700">产品宿主与接入</text><text x="42" y="154" fill="#526b5d" font-family="sans-serif" font-size="12">Web / Desktop · Headless · SDK / ACP</text><text x="42" y="179" fill="#657a6f" font-family="sans-serif" font-size="11">查看固定版本源码 ↗</text></a><a href="https://github.com/deepseek-ai/deepseek-harness/blob/5badb15009ae1756c3afe0ae0cef1faafc290ccc/packages/boot/app-boot/README.zh.md" target="_blank"><rect x="650" y="100" width="600" height="96" rx="11" fill="#e4eee3" stroke="#9cb2a5"/><text x="662" y="128" fill="#173f32" font-family="sans-serif" font-size="17" font-weight="700">运行时组装</text><text x="662" y="154" fill="#526b5d" font-family="sans-serif" font-size="12">Profile → Bundle / Patch → 插件树</text><text x="662" y="179" fill="#657a6f" font-family="sans-serif" font-size="11">查看固定版本源码 ↗</text></a><a href="https://github.com/deepseek-ai/deepseek-harness/blob/5badb15009ae1756c3afe0ae0cef1faafc290ccc/docs/subsystems/system-prompt.zh.md" target="_blank"><rect x="30" y="315" width="270" height="96" rx="11" fill="#fffef7" stroke="#9cb2a5"/><text x="42" y="343" fill="#173f32" font-family="sans-serif" font-size="17" font-weight="700">上下文贡献</text><text x="42" y="369" fill="#526b5d" font-family="sans-serif" font-size="12">Instructions · Skills · 运行时上下文</text><text x="42" y="394" fill="#657a6f" font-family="sans-serif" font-size="11">查看固定版本源码 ↗</text></a><a href="https://github.com/deepseek-ai/deepseek-harness/blob/5badb15009ae1756c3afe0ae0cef1faafc290ccc/packages/core/system-prompt/README.zh.md" target="_blank"><rect x="350" y="315" width="270" height="96" rx="11" fill="#fffef7" stroke="#9cb2a5"/><text x="362" y="343" fill="#173f32" font-family="sans-serif" font-size="17" font-weight="700">请求组装</text><text x="362" y="369" fill="#526b5d" font-family="sans-serif" font-size="12">SystemPrompt · 工具 schema</text><text x="362" y="394" fill="#657a6f" font-family="sans-serif" font-size="11">查看固定版本源码 ↗</text></a><a href="https://github.com/deepseek-ai/deepseek-harness/blob/5badb15009ae1756c3afe0ae0cef1faafc290ccc/packages/core/agent-loop/README.zh.md" target="_blank"><rect x="650" y="315" width="270" height="96" rx="11" fill="#fffef7" stroke="#9cb2a5"/><text x="662" y="343" fill="#173f32" font-family="sans-serif" font-size="17" font-weight="700">Agent 与默认驱动器</text><text x="662" y="369" fill="#526b5d" font-family="sans-serif" font-size="12">Inbox · Turn / Step · 取消 / 重试</text><text x="662" y="394" fill="#657a6f" font-family="sans-serif" font-size="11">查看固定版本源码 ↗</text></a><a href="https://github.com/deepseek-ai/deepseek-harness/blob/5badb15009ae1756c3afe0ae0cef1faafc290ccc/docs/subsystems/llm-streaming.zh.md" target="_blank"><rect x="970" y="315" width="280" height="96" rx="11" fill="#f6eddc" stroke="#9cb2a5"/><text x="982" y="343" fill="#173f32" font-family="sans-serif" font-size="17" font-weight="700">模型接入</